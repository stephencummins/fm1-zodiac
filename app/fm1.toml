# The template's build settings (tools/build.py)
name = "zodiac"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_355"          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "zodiac"
title = "Zodiac"                # the name people see
usb_product = "ZODIAC FM-1"
o2 = ["core/*.c"]              # the core (app/core is a link to ../core): pictures and music, no hardware in it
o2_cflags = ["-DZ_FM1", "-DZ_PACKED", "-DZ_ECHO16"]   # big buffers in the pool, pictures packed, a 16-bit echo line
include = ["core"]
ram_layout = "packed"          # one SRAM budget: the core's buffers need more than the fixed pool gives
words = "words.tsv"
font_full = ["M"]              # the welcome and the tips are written in the middle face, lower case too
ble = false                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = false             # and the FM-1 connects to Bluetooth MIDI devices too
companion = false              # the companion services: the saved settings as a file for a page (app.h APP_FILE_OBJS)
lcd_panel = true               # the FM-1 panel's own voltages and gamma at start-up: without them the screen is pale
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "Twelve signs that play themselves"
repo = "https://github.com/stephencummins/fm1-zodiac"
licence = "GPL-3.0-only"
credits = "Zodiac is built on fm1-base by Charles Vestal and felucca-bsp, which come from Felucca by Leo Kuroshita, Hügelton Instruments."                   # a sentence for the installer's footer: what your firmware is built from
# firmware.json, for firmware hubs (docs/FIRMWARE-JSON.md): the build writes it from these and the keys above
author = "Stephen Cummins"      # who made it
description = "Twelve signs of the zodiac, each a picture and a piece of music that plays itself."
tags = ["synth", "experimental"]    # from the list in docs/FIRMWARE-JSON.md; the build refuses another
install = "https://zodiac.stephen8n.com/install/"   # the page that installs it
site = "https://zodiac.stephen8n.com/"
screenshot = "docs/img/screen-playing.png"   # for the hubs' cards: a square PNG, at least 240 x 240, in your repository
